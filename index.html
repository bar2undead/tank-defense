<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坦克大战：保卫大本营</title><style>body{margin:0;background:#101a2d;color:white;font-family:system-ui,Arial}main{max-width:860px;margin:22px auto;padding:0 12px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{font-size:25px}button{background:#ffd15a;color:#171b25;border:0;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer}input{padding:12px;border:0;border-radius:8px;width:95px;font-size:17px}.bar{background:#233650;border-radius:12px;padding:12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}canvas{width:100%;background:#243b29;border:3px solid #4a75a5;border-radius:10px;image-rendering:pixelated;display:block}.info{padding:10px;color:#d1e3fa}.touch{display:flex;gap:16px;justify-content:center;margin:10px}.pad{display:grid;grid-template-columns:repeat(3,52px);gap:3px}.pad button{height:48px;padding:0}.fire{min-width:90px}</style></head><body><main><header><h1>🛡️ 坦克大战：保卫大本营</h1><button id="restart">重新开始</button></header><div class="bar"><button id="create">创建房间</button><input id="code" maxlength="6" placeholder="房间号"><button id="join">加入房间</button><span id="status">连接中…</span></div><canvas id="game" width="800" height="640"></canvas><div class="info">移动：WASD / 方向键　开炮：空格 / J　两人一起保护底部的金色大本营。房主可开启下一关。</div><div class="touch"><div class="pad"><span></span><button data-key="up">▲</button><span></span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><button class="fire" data-key="fire">🔥 开炮</button><button id="next">下一关</button></div></main><script src="/client.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tank Defense (V2.9)</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#223958,#0b1220 75%);color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(98vw,1420px);margin:12px auto}header,.bar,.bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(19px,2vw,29px);margin:8px 0}button,select,input{font:inherit;border-radius:9px;border:1px solid #617693;padding:10px;background:#223552;color:white}button{cursor:pointer;background:#f7c957;color:#171d2b;font-weight:800;border:0}button:hover{filter:brightness(1.1)}button:disabled{opacity:.45;cursor:not-allowed}.bar{background:#1b2b41;padding:11px;border-radius:12px;margin:10px 0}input{width:120px}#playerName{width:108px}#status{flex:1;min-width:190px;font-size:14px;color:#c9d9ee} .gameWrap{position:relative}#fullscreenBtn{position:absolute;right:12px;top:12px;z-index:4;background:#182c45e8;color:#fff;border:1px solid #9ab3d1;padding:8px 12px}.gameWrap:fullscreen{display:flex;align-items:center;justify-content:center;background:#000}.gameWrap:fullscreen canvas{max-height:100vh;width:auto;max-width:100vw}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border:3px solid #6382ac;border-radius:12px;background:#293c2c;image-rendering:pixelated;touch-action:none}.info{font-size:14px;color:#d1dceb;padding:9px 3px;line-height:1.6}.bottom{justify-content:space-between}.touch{display:flex;gap:16px;align-items:center;touch-action:none}.pad{display:grid;grid-template-columns:repeat(3,52px);gap:4px}.pad button{min-height:44px;padding:3px}.fire{min-height:75px;min-width:90px}.rescue{min-height:75px;background:#7de3c2}.language{display:flex;align-items:center;gap:8px;font-size:14px}select{background:#243854}@media(min-width:1050px){.touch{opacity:.85}}@media(max-width:600px){.pad{grid-template-columns:repeat(3,43px)}.pad button{min-height:38px}.fire,.rescue{min-width:66px;min-height:66px}.bar{gap:6px}.bar button{padding:9px}input{width:90px}}
 #nextOverlay{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);z-index:5;font-size:25px;padding:15px 32px;background:#e6b34a;color:#13222c;border:2px solid #fff;box-shadow:0 4px 18px #0008}#nextOverlay[hidden]{display:none}</style></head><body><main><header><h1 id="title">🛡️ Tank Defense (V2.9)</h1><div class="language"><label for="language" id="languageLabel">Language</label><select id="language"><option value="auto">Auto</option><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="ja">日本語</option><option value="fr">Français</option></select></div></header><div class="bar"><label for="playerName" id="nameLabel">Name</label><input id="playerName" maxlength="8" pattern="[A-Za-z]{1,8}" placeholder="Your name" value="Potato"><label for="difficulty" id="difficultyLabel">Difficulty</label><select id="difficulty"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select><button id="solo">Solo</button><button id="bot">Play with AI</button><button id="create">Create room</button><input id="code" maxlength="6" inputmode="numeric" placeholder="Room code"><button id="join">Join room</button><button id="ready" disabled>Ready</button><button id="start" disabled>Start Game</button><button id="pause" disabled>Pause</button><button id="restartLevel">Restart This Level</button><button id="restart">Restart Entire Game</button><button id="next">Next level</button><span id="status">Connecting…</span></div><div class="bar" id="shopPanel" style="display:none"><strong id="shopTitle">Upgrade shop</strong><span id="coinsLabel">Coins: 0</span><button data-buy="damage">Damage</button><button data-buy="rate">Fire rate</button><button data-buy="speed">Speed</button><button data-buy="base">Base HP</button><button data-buy="revive">Team Revive (250)</button><button id="useRevive" disabled>Use Team Revive</button></div><div class="gameWrap" id="gameWrap"><canvas id="game" width="1280" height="720" aria-label="Tank defense game"></canvas><button id="nextOverlay" type="button" hidden>Next level ▶</button><button id="fullscreenBtn" type="button">⛶ Fullscreen</button></div><div class="bottom"><div class="info" id="help">Move: WASD / Arrows · Shoot: Space / J · Revive: stand beside teammate for 3s · Protect the golden base!</div><div class="touch"><div class="pad"><span></span><button data-key="up">▲</button><span></span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><button class="fire" data-key="fire" id="fireBtn">🔥 Fire</button></div></div></main><script src="/client.js"></script></body></html>
